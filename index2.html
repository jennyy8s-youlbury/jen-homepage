<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="style.css">
  <!-- PapaParse CSV Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div id="app">Loading homepage...</div>

  <script>
    Papa.parse("links.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const rows = results.data;

        // Group rows by category
        const categories = {};
        rows.forEach(row => {
          const cat = row.Category ? row.Category.trim() : "Other";
          if (!categories[cat]) {
            categories[cat] = [];
          }
          categories[cat].push(row);
        });

        // Generate HTML markup
        let htmlOutput = "";
        for (const [categoryName, items] of Object.entries(categories)) {
          htmlOutput += `<h2>${categoryName}</h2>`;
          htmlOutput += `<div class="grid">`;
          
          items.forEach(item => {
            htmlOutput += `
              <a href="${item.URL}" class="card">
                <img src="${item.Icon}" alt="${item.Title}">
                <span>${item.Title}</span>
              </a>
            `;
          });

          htmlOutput += `</div>`;
        }

        // Render to DOM
        document.getElementById("app").innerHTML = htmlOutput;
      },
      error: function(err) {
        document.getElementById("app").innerHTML = "<p>Error loading CSV data.</p>";
        console.error("PapaParse error:", err);
      }
    });
  </script>
</body>
</html>
